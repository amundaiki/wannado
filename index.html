                                <div className="flex-1">
                                  <p className="text-gray-700 font-medium">{oppgave.task}</p>
                                  <p className="text-orange-700 text-sm mt-1">⏱ {oppgave.tid}</p>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>

                      <div className="mt-8 bg-gradient-to-r from-green-100 to-emerald-100 p-6 rounded-lg border-4 border-green-500">
                        <h3 className="text-2xl font-bold text-gray-700 mb-3"> Pro tip:</h3>
                        <p className="text-gray-700 text-lg">
                          Print disse sjekklistene og heng dem på kontoret. Hak av med en penn hver gang dere gjør noe.
                          Dette gjør markedsføring til en VANE - ikke noe dere "glemmer".
                        </p>
                      </div>
                    </div>
                  )}

                  {/* Sosiale medier & kalender (kombinert) */}
                  {activeTab === 'somekombinert' && (
                    <div>
                      <h2 className="text-3xl font-bold text-gray-700 mb-4">
                        <Icon name="calendar" size={32} className="inline mr-2" />
                        Sosiale Medier & Innholdskalender
                      </h2>

                      <div className="bg-gradient-to-r from-blue-100 to-cyan-100 p-6 rounded-lg border-l-4 border-blue-600 mb-8">
                        <p className="text-gray-700 text-lg font-medium">
                          {sosialemedier.intro}
                        </p>
                      </div>

                      {/* Plattform-oversikt */}
                      <div className="mb-12">
                        <h3 className="text-2xl font-bold text-gray-700 mb-4"> Plattform-oversikt</h3>
                        <div className="grid md:grid-cols-2 gap-6">
                          {sosialemedier.plattformer.map((plattform, index) => (
                            <div key={index} className="bg-white rounded-lg border border-gray-300 shadow-lg p-6">
                              <h4 className="text-xl font-bold text-gray-700 mb-3">{plattform.navn}</h4>

                              <div className="bg-white p-4 rounded-lg mb-4 border-l-4 border-blue-500">
                                <p className="text-gray-700">{plattform.hvorfor}</p>
                              </div>

                              <div className="mb-4">
                                <p className="font-bold text-gray-700 mb-2"> Det viktigste:</p>
                                <ul className="space-y-1">
                                  {plattform.viktigst.map((punkt, i) => (
                                    <li key={i} className="text-gray-600 text-sm">• {punkt}</li>
                                  ))}
                                </ul>
                              </div>

                              <div className="bg-green-100 p-3 rounded border-2 border-green-400">
                                <p className="text-gray-700 font-bold text-sm">⏱ Tidsbruk: {plattform.tid}</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Resten av innholdskalender-seksjonen */}
                      <div className="border-t-4 border-pink-300 pt-8">
                        <h2 className="text-3xl font-bold text-pink-900 mb-4">
                           Din Innholdskalender
                        </h2>

                      <div className="bg-gradient-to-r from-pink-100 to-rose-100 p-6 rounded-lg border-l-4 border-pink-600 mb-6">
                        <p className="text-pink-900 text-lg font-medium">
                          {innholdskalender.intro}
                        </p>
                      </div>

                      <div className="mb-8">
                        <h3 className="text-2xl font-bold text-pink-900 mb-4"> Din uke - dag for dag</h3>
                        <div className="space-y-4">
                          {innholdskalender.ukeEksempel.map((dag, index) => (
                            <div key={index} className="bg-white rounded-lg border-2 border-pink-300 shadow-lg p-5">
                              <div className="flex items-center gap-3 mb-3">
                                <div className="bg-pink-600 text-white px-4 py-2 rounded-lg font-bold">
                                  {dag.dag}
                                </div>
                                <div className="flex-1">
                                  <p className="font-bold text-pink-900">{dag.platform}</p>
                                  <p className="text-pink-700 text-sm"> {dag.tid}</p>
                                </div>
                              </div>

                              <div className="space-y-3">
                                <div className="bg-white p-3 rounded">
                                  <p className="text-xs font-semibold text-gray-700 mb-1"> Innhold:</p>
                                  <p className="text-gray-700 text-sm">{dag.innhold}</p>
                                </div>

                                <div className="bg-white p-3 rounded">
                                  <p className="text-xs font-semibold text-gray-700 mb-1"> Tekst:</p>
                                  <p className="text-gray-700 text-sm font-medium">{dag.tekst}</p>
                                </div>

                                <div className="bg-white p-3 rounded">
                                  <p className="text-xs font-semibold text-gray-700 mb-1"># Hashtags:</p>
                                  <p className="text-gray-700 text-sm">{dag.hashtags}</p>
                                </div>

                                {dag.boost && (
                                  <div className="bg-white p-3 rounded border-l-4 border-orange-500">
                                    <p className="text-xs font-semibold text-gray-700 mb-1"> Boost:</p>
                                    <p className="text-gray-700 text-sm">{dag.boost}</p>
                                  </div>
                                )}

                                <div className="bg-amber-50 p-3 rounded">
                                  <p className="text-xs font-semibold text-gray-700 mb-1"> Tips:</p>
                                  <p className="text-gray-700 text-sm">{dag.tips}</p>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Templates */}
                      <div className="mb-8">
                        <h3 className="text-2xl font-bold text-indigo-900 mb-4"> Innlegg-templates (kopier og tilpass)</h3>
                        <div className="grid md:grid-cols-2 gap-4">
                          {innholdskalender.templates.map((template, index) => (
                            <div key={index} className="bg-indigo-50 p-4 rounded-lg border-2 border-indigo-300">
                              <p className="text-indigo-900 text-sm font-mono">{template}</p>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Emoji-guide */}
                      <div className="bg-gradient-to-r from-red-100 to-orange-100 p-6 rounded-lg border-4 border-red-500">
                        <h3 className="text-2xl font-bold text-red-900 mb-4">Emoji-guide for Instagram</h3>
                        <div className="space-y-4">
                          <div className="bg-white p-4 rounded">
                            <p className="font-bold text-gray-700 mb-2">De eneste emojiene dere trenger:</p>
                            <p className="text-4xl mb-2">{innholdskalender.emojis.alltidBruke}</p>
                            <p className="text-gray-600 text-sm">Båt, bølger, sol, solnedgang, hjerte</p>
                          </div>
                          <div className="bg-red-50 p-4 rounded border-l-4 border-red-600">
                            <p className="font-bold text-red-900 mb-2">{innholdskalender.emojis.aldriOverdrive}</p>
                          </div>
                          <div className="bg-white p-4 rounded">
                            <p className="font-bold text-gray-700 mb-2">Eksempler:</p>
                            <div className="space-y-2">
                              <div className="bg-white p-3 rounded border-l-4 border-green-500">
                                <p className="text-gray-700 font-bold text-xs mb-1">RIKTIG:</p>
                                <p className="text-gray-700 text-sm">'God morgen! Vi seiler i dag kl 18:00. Book nå! ⛵'</p>
                              </div>
                              <div className="bg-red-50 p-3 rounded border-l-4 border-red-500">
                                <p className="text-red-900 font-bold text-xs mb-1">GALT (ikke gjør dette!):</p>
                                <p className="text-red-900 text-sm">'God morgen!!! Vi seiler i dag kl 18:00!!! Book nå!!! 🚤⛵🌊☀️💙🎉'</p>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                      </div>
                    </div>
                  )}

                  {/* Ordforklaringer */}
                  {activeTab === 'ordbok' && (
                    <div>
                      <h2 className="text-3xl font-bold text-gray-700 mb-6">
                        <Icon name="book" size={32} className="inline mr-2" />
                        Ordforklaringer - Markedsføring gjort enkelt
                      </h2>

                      <div className="bg-white border-l-4 border-blue-500 p-4 mb-6 rounded">
                        <p className="text-gray-700">
                          <strong>Her finner du forklaringer på alle faguttrykk</strong> som brukes i markedsføringsplanen. 
                          Alle forklaringer er skrevet på enkel norsk, med eksempler fra Wannado/Havsul.
                        </p>
                      </div>

                      <div className="space-y-4">
                        {glossary.map((item, index) => (
                          <div key={index} className="bg-white border border-amber-300 rounded-lg p-4">
                            <h4 className="font-bold text-gray-700 mb-2 flex items-center gap-2">
                              <Icon name="book" size={18} className="text-gray-700" />
                              {item.term}
                            </h4>
                            <p className="text-gray-700 text-sm mb-2">{item.explanation}</p>
                            {item.link && (
                              <a 
                                href={item.link} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className="text-gray-700 text-sm font-medium hover:text-gray-700"
                              >
                                → Les mer
                              </a>
                            )}
                          </div>
                        ))}
                      </div>

                      <div className="mt-8 bg-white p-6 rounded-lg border border-gray-300">
                        <h3 className="text-lg font-bold text-gray-700 mb-3">Trenger du mer hjelp?</h3>
                        <ul className="space-y-2 text-gray-600">
                          <li>• Kontakte en lokal markedsføringskonsulent i Arendal</li>
                          <li>• Se YouTube-tutorials (søk på navnet på verktøyet + "tutorial")</li>
                          <li>• Starte smått - velg 2-3 tiltak første året og lær underveis</li>
                        </ul>
                      </div>
                    </div>
                  )}
                </div>

                {/* Footer */}
                <div className="mt-6 bg-amber-900 text-white p-6 rounded-lg text-center">
                  <p className="text-lg font-semibold mb-2">Lykke til med 2026! </p>
                  <p className="text-amber-200 text-sm">
                    Denne planen er et levende dokument. Juster og tilpass etter hvert som dere lærer.
                  </p>
                </div>
              </div>
            </div>
          );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<WannadoMarkedsplan2026 />);
    </script>
</body>
</html>
